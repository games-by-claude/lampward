<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport">
    <meta content="#05070f" name="theme-color">
    <title>Lampward</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #05070f;
        color: #f4efe2;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070f;
        z-index: 1;
      }
      #loading .lamp {
        width: 10px;
        height: 10px;
        background: #ffd36b;
        box-shadow: 0 0 24px 8px rgba(255, 211, 107, 0.45);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <canvas id="main"></canvas>
    <div id="loading"><div class="lamp"></div></div>
    <script src="/arcadible/sdk/v1.js"></script>
    <script src="./game.js"></script>
    <script src="./main.js" type="module"></script>
  </body>
</html>
